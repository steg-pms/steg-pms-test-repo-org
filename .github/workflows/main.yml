name: Deploy HTML to GitHub Pages
run-name: 배포 ${{ inputs.deployment_ticket_id }} (${{ inputs.environment }})

on:
    workflow_dispatch:   # 수동 실행 전용
      inputs:
        deployment_ticket_id:
          description: '배포 티켓 번호'
          required: true
          type: string
        environment:
          description: '배포 환경'
          required: true
          type: string
        commit_sha:
          description: '배포할 커밋 SHA'
          required: true
          type: string
        reason:
          description: '배포 이유'
          required: false
          default: '수동 배포'

permissions:
    contents: read

jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: 배포 환경 확인
          env:
            TICKET_ID: ${{ inputs.deployment_ticket_id }}
            ENVIRONMENT: ${{ inputs.environment }}
            COMMIT_SHA: ${{ inputs.commit_sha }}
            REASON: ${{ inputs.reason }}
            ENV_DEV: ${{ vars.PMS_ENV_DEV }}
            ENV_PRD: ${{ vars.PMS_ENV_PRD }}
          run: |
            if [ -z "$ENV_DEV" ] || [ -z "$ENV_PRD" ]; then
              echo "::error::레포 variable PMS_ENV_DEV / PMS_ENV_PRD 가 설정되지 않았다"
              exit 1
            fi
            case "$ENVIRONMENT" in
              "$ENV_DEV") NAME="개발" ;;
              "$ENV_PRD") NAME="운영" ;;
              *) echo "::error::알 수 없는 배포 환경: $ENVIRONMENT"; exit 1 ;;
            esac
            echo "ENV_NAME=$NAME" >> $GITHUB_ENV
            echo "배포 티켓: $TICKET_ID"
            echo "배포 환경: $NAME ($ENVIRONMENT)"
            echo "배포 SHA: $COMMIT_SHA"
            echo "배포 이유: $REASON"

        - name: Checkout
          uses: actions/checkout@v4
          with:
            ref: ${{ inputs.commit_sha }}

        - name: 배포 정보 출력
          env:
            TICKET_ID: ${{ inputs.deployment_ticket_id }}
            ENVIRONMENT: ${{ inputs.environment }}
            COMMIT_SHA: ${{ inputs.commit_sha }}
            REASON: ${{ inputs.reason }}
          run: |
            echo "배포 티켓: $TICKET_ID"
            echo "배포 환경: $ENVIRONMENT ($ENV_NAME)"
            echo "배포 SHA: $COMMIT_SHA"
            echo "배포 이유: $REASON"

        # PMS 배포 결과 콜백
        # 이 스텝이 실패하면 PMS 의 배포 건은 'ING' 로 남는다. PMS 는 인증에 실패한 콜백을
        # FAILED 로 기록하지 않는다 - 티켓번호만 알면 남의 배포 상태를 바꿀 수 있게 되기 때문이다.
        # 그래서 설정이 어긋난 것은 여기서 붉게 드러나야 하고, 고친 뒤 Re-run jobs 로 재전송한다.
        - name: PMS 배포 결과 콜백
          if: always()   # 성공·실패 모두 전송
          env:
            PMS_CALLBACK_URL: ${{ vars.PMS_CALLBACK_URL }}
            PMS_TOKEN: ${{ secrets.PMS_CALLBACK_TOKEN }}
            # 배포 결과 페이지. 미설정이면 빈 값으로 나간다(= 기존 동작과 동일)
            # 실제 Pages 배포 스텝(actions/deploy-pages)을 넣으면
            # steps.deployment.outputs.page_url 로 바꾸면 된다
            PAGE_URL: ${{ vars.PMS_PAGE_URL }}
            TICKET_ID: ${{ inputs.deployment_ticket_id }}
            ENVIRONMENT: ${{ inputs.environment }}
            COMMIT_SHA: ${{ inputs.commit_sha }}
            JOB_STATUS: ${{ job.status }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            WORKFLOW_SHA: ${{ github.sha }}
            RUN_ID: ${{ github.run_id }}
            RUN_NUMBER: ${{ github.run_number }}
          run: |
            # (1) 설정 누락을 조용히 넘기지 않는다
            # secret, variable 이 없으면 GitHub 은 경고 없이 빈 문자열로 치환한다.
            # 그대로 보내면 PMS 가 401 로 거부하고 배포 건이 ING 로 남는다
            if [ -z "$PMS_CALLBACK_URL" ]; then
              echo "::error::레포 variable PMS_CALLBACK_URL 이 설정되지 않았다"
              exit 1
            fi
            if [ -z "$PMS_TOKEN" ]; then
              echo "::error::레포 secret PMS_CALLBACK_TOKEN 이 설정되지 않았다 (PMS 서버의 SCM_DEPLOY_CALLBACK_TOKEN 과 같은 값이어야 한다)"
              exit 1
            fi

            # (2) 결과 페이지 URL 은 성공했을 때만
            # 실패인데 값이 남아 있으면 실패한 배포가 성공한 것처럼 보인다
            if [ "$JOB_STATUS" != "success" ]; then
              PAGE_URL=""
            fi

            cat > payload.json <<EOF
            {
              "deployment_ticket_id": "$TICKET_ID",
              "environment": "$ENVIRONMENT",
              "status": "$JOB_STATUS",
              "page_url": "$PAGE_URL",
              "run_url": "$RUN_URL",
              "commit_sha": "$COMMIT_SHA",
              "workflow_sha": "$WORKFLOW_SHA",
              "run_id": "$RUN_ID",
              "run_number": "$RUN_NUMBER"
            }
            EOF
            echo "콜백 전송: $PMS_CALLBACK_URL"
            cat payload.json

            # (3) 상태코드와 응답 본문을 남긴다
            # -f 를 쓰면 curl 이 응답 본문을 버려서 401 인지 500 인지 서버 로그를 봐야 한다
            HTTP=$(curl -sS -X POST "$PMS_CALLBACK_URL" \
              --retry 3 --retry-connrefused --retry-delay 5 --max-time 60 \
              -H "Content-Type: application/json" \
              -H "X-PMS-Token: $PMS_TOKEN" \
              -d @payload.json \
              -o response.json -w '%{http_code}') || HTTP=""
            echo "HTTP $HTTP"
            cat response.json 2>/dev/null || true
            echo

            case "$HTTP" in
              2*)
                ;;
              401)
                echo "::error::PMS 콜백 인증 실패(401). 레포 secret PMS_CALLBACK_TOKEN 과 PMS 서버의 SCM_DEPLOY_CALLBACK_TOKEN 값이 서로 다르다"
                exit 1 ;;
              500)
                echo "::error::PMS 콜백 거부(500). PMS 서버에 SCM_DEPLOY_CALLBACK_TOKEN 이 설정되지 않았을 수 있다"
                exit 1 ;;
              ''|000)
                echo "::error::PMS 콜백 서버에 접속하지 못했다. URL, 방화벽 확인: $PMS_CALLBACK_URL"
                exit 1 ;;
              *)
                echo "::error::PMS 콜백 실패 HTTP $HTTP"
                exit 1 ;;
            esac

            # 2xx 라도 PMS 가 반영하지 않았을 수 있다(배포 건을 못 찾음 등). 이때도 ING 로 남는다
            if grep -q '"applied"[[:space:]]*:[[:space:]]*false' response.json 2>/dev/null; then
              echo "::warning::PMS 가 콜백을 반영하지 않았다. 위 응답의 reason 확인 (배포 건이 ING 로 남는다)"
            fi
            echo "PMS 콜백 완료"
